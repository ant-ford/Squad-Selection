name: Preview API

# Deploys the API from a branch to its own Worker, hkfc-api-preview, so the
# branch can be checked in a browser before it merges: run the frontend
# locally with `npm run dev:preview-api` and it talks to this Worker.
#
# Started by hand only (Actions tab -> Preview API -> Run workflow, pick the
# branch). Never on push or pull_request: the repo is public, and this job
# holds a Cloudflare token. That token cannot be limited to one Worker, so
# the `preview` environment should require the owner's approval per run.
#
# What keeps the preview away from production is in worker/wrangler.toml
# under [env.preview]: its own Worker name, no custom domain, no cron, no
# shared KV cache, and CORS only for http://localhost:5173 and :5174. Its
# Airtable token is a separate, read-only one, so it cannot change club
# data; with DATA_BACKEND = "supabase" it reads and writes eddy-preview.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    # A later run replaces an earlier one; there is only one preview Worker.
    concurrency:
      group: deploy-preview
      cancel-in-progress: true
    steps:
      - name: Refuse main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::main is deployed by CI. Pick the branch you want to preview."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Cheap guard: a branch that does not typecheck is not worth looking at.
      - name: Typecheck API
        run: npm run typecheck:worker

      - name: Deploy API Worker (hkfc-api-preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # pipefail: without it the pipe reports tee's status, so a failed
          # deploy surfaced as "could not find the preview URL" instead of
          # wrangler's own error.
          set -o pipefail
          npx wrangler deploy --config worker/wrangler.toml --env preview | tee deploy.log
          url=$(grep -oE 'https://hkfc-api-preview\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Could not find the preview URL in the deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Set on every run so rotating the GitHub secret is all it takes. Read
      # from stdin, so the value never appears in the command line or log.
      - name: Set Airtable token (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: printf '%s' "$AIRTABLE_TOKEN" | npx wrangler secret put AIRTABLE_TOKEN --config worker/wrangler.toml --env preview

      # eddy-preview's secret key, for the Supabase data backend. Same pattern:
      # stdin only, set on every run.
      - name: Set Supabase data key (eddy-preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$DATA_SUPABASE_SECRET_KEY" ]; then
            echo "::warning::DATA_SUPABASE_SECRET_KEY is not in the preview environment; Supabase reads will fail."
            exit 0
          fi
          printf '%s' "$DATA_SUPABASE_SECRET_KEY" | npx wrangler secret put DATA_SUPABASE_SECRET_KEY --config worker/wrangler.toml --env preview

      # Signs calendar feed links. Preview's own secret, never production's,
      # so a preview can never hand out a link that works on production.
      - name: Set calendar secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CALENDAR_SECRET: ${{ secrets.CALENDAR_SECRET }}
        run: |
          if [ -z "$CALENDAR_SECRET" ]; then
            echo "::warning::CALENDAR_SECRET is not in the preview environment; calendar links will fail."
            exit 0
          fi
          printf '%s' "$CALENDAR_SECRET" | npx wrangler secret put CALENDAR_SECRET --config worker/wrangler.toml --env preview

      # Resend, for email. Preview redirects every message to the captain.
      - name: Set Resend key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_TOKEN }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_TOKEN is not in the preview environment; email will not send."
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config worker/wrangler.toml --env preview

      # OpenRouter, for the commitment review drafts. Without it, no drafts.
      - name: Set OpenRouter key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY is not in the preview environment; reviews get no AI drafts."
            exit 0
          fi
          printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY --config worker/wrangler.toml --env preview

      # The render-pdf Edge Function (supabase/functions) on eddy-preview,
      # which fills PDF templates for the Worker. It checks callers with the
      # project's own secret key, so it needs no secret of its own. Skipped
      # until SUPABASE_ACCESS_TOKEN (a Supabase personal access token: the
      # project keys cannot deploy functions) is in the preview environment.
      - name: Deploy PDF function (eddy-preview)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not in the preview environment; the PDF function was not deployed."
            exit 0
          fi
          npx --yes supabase@2.118.0 functions deploy render-pdf --project-ref zlqzpzmqjqnrppmtevbv --use-api

      # A CORS preflight needs no sign-in and proves the two things the
      # local frontend depends on: the Worker answers, and it accepts
      # http://localhost:5173. Retried briefly while the deploy propagates.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            origin=$(curl -s -o /dev/null -D - -X OPTIONS -H "Origin: http://localhost:5173" \
              "$URL/api/my-fixtures" | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
            if [ "$origin" = "http://localhost:5173" ]; then
              echo "Preview API is up and accepts http://localhost:5173."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$URL did not answer the preflight for http://localhost:5173."
          exit 1

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Preview API deployed"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`)"
            echo "- URL: $URL"
            echo "- Frontend: \`npm run dev:preview-api\`, then http://localhost:5173 (or add \`-- --port 5174\`)"
            echo "- Data: whatever DATA_BACKEND in [env.preview] says. On supabase, saves change eddy-preview; on airtable they fail (read-only token)."
            echo "- Health: \`$URL/health?deep=1\`"
          } >> "$GITHUB_STEP_SUMMARY"
