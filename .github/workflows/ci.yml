name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Typecheck worker
        run: npx tsc --noEmit -p worker/tsconfig.json
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build