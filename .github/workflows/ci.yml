name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the migration check below can find where a pull
      # request branched from its base and what it added since.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # scripts/check-migrations.mjs: no two migrations share a version
      # (`supabase db push` silently skips the second), and a pull request
      # only adds migrations newer than the newest on its base branch (db
      # push will not apply an older version after a newer one). Before
      # `npm ci` because it needs nothing installed and fails fast.
      - name: Check migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/check-migrations.mjs --base "origin/$BASE_REF"
          else
            node scripts/check-migrations.mjs
          fi

      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify

      # Bundles every Worker the way a deploy would, without deploying, so an
      # invalid wrangler config fails the PR rather than the deploy. Its own
      # step, not part of `verify`: Cloudflare's Workers Builds run verify
      # for one Worker and refuse dry runs of the others' configs.
      - name: Check Worker configs
        run: npm run check:workers

  # Deploys both Workers on a merge to main. Nothing deploys from a
  # developer machine: the Cloudflare token lives in the `production`
  # environment, whose deployment-branch policy admits main and nothing
  # else, so a pull request cannot reach it even by editing this file.
  #
  # `needs: verify` is what stops a red build reaching the club. The
  # pull_request trigger above already ran the same checks, but a merge
  # commit is not either parent, so it is verified on its own terms.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one in flight: a half-applied
    # Worker upload is worse than a queued run.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # The deploy gate: production must already have every migration in
      # the repo, or the new API would query tables and columns that are not
      # there. The owner applies migrations to production by hand before a
      # merge; this catches the one that was forgotten. It runs before
      # anything deploys, so a failure leaves both Workers as they were.
      #
      # One read-only SELECT on supabase_migrations.schema_migrations, with
      # PROD_DB_URL (the same production-environment secret the nightly
      # backup uses). A step here rather than its own job: this job already
      # has the production environment and its secrets, and a second job
      # would open a second production deployment for the same commit.
      #
      # psql's own error text is never printed: a libpq error can quote part
      # of the connection string, and GitHub masks only the whole secret.
      - name: Check production has every migration
        id: migrations
        env:
          PGURL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::PROD_DB_URL is not in the production environment, so the deploy cannot check production's migrations. Add it under Settings > Environments > production > Environment secrets, then re-run this job."
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y postgresql-client >/dev/null; }

          applied="$RUNNER_TEMP/applied-migrations.txt"
          err="$RUNNER_TEMP/psql-error.txt"
          if ! PGCONNECT_TIMEOUT=20 psql "$PGURL" -X -A -t -q -v ON_ERROR_STOP=1 \
               -c "select version from supabase_migrations.schema_migrations order by version" \
               >"$applied" 2>"$err"; then
            reason="psql failed"
            if grep -q "does not exist" "$err"; then reason="supabase_migrations.schema_migrations does not exist"
            elif grep -q "password authentication failed" "$err"; then reason="the password in PROD_DB_URL was refused"
            elif grep -q "could not translate host name" "$err"; then reason="the host in PROD_DB_URL was not found"
            elif grep -qi "timeout" "$err"; then reason="the connection timed out"
            elif grep -q "permission denied" "$err"; then reason="the user in PROD_DB_URL cannot read the migration history"
            fi
            rm -f "$err"
            echo "::error::Not deployed: could not read production's migration history ($reason). psql's message is withheld because it can quote the connection string. Check PROD_DB_URL in the production environment, then re-run this job."
            exit 1
          fi
          rm -f "$err"

          if ! node scripts/check-migrations.mjs --applied "$applied"; then
            echo "::error::Not deployed: production is missing the migration(s) above. Apply each to eddy-production (SQL editor or supabase db push) so it is recorded in supabase_migrations.schema_migrations, then re-run this job. If the SQL already ran but was not recorded, record it instead (supabase migration repair --status applied <version>)."
            exit 1
          fi
          echo "Production has recorded every migration in the repo ($(grep -c . "$applied") versions in its history)."

      # `npm run deploy` would build and deploy in one step, but the build
      # has to be its own step here so a bundling failure is reported as a
      # build failure rather than a deploy one.
      - name: Build web bundle
        run: npm run build

      # wrangler comes from the lockfile rather than an action that fetches
      # its own copy, so CI deploys with exactly the version developed
      # against. It reads CLOUDFLARE_API_TOKEN from the environment, which
      # is why no `wrangler login` is involved.
      #
      # CLOUDFLARE_ACCOUNT_ID is deliberately absent: wrangler resolves the
      # account itself when the token can see exactly one. Add it as an
      # environment secret only if a run fails asking to choose.
      - name: Deploy web Worker (hkfc-squad-selection)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # wrangler reports a failed trigger deploy as "a request to the
      # Cloudflare API ... failed" and drops the API's own error, which is
      # not enough to act on - it cannot distinguish a permission problem
      # from a conflicting DNS record. This asks the API the three
      # questions that tell those apart, and prints only parsed fields:
      # no request headers, so the token cannot reach a log that is public.
      # Not when the migration gate stopped the run: nothing reached
      # Cloudflare, so there is nothing to explain.
      - name: Explain a failed deploy
        if: failure() && steps.migrations.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() {
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"
          }
          err='[.errors[]? | {code, message}]'

          # The id says WHICH token this is. Cloudflare shows a token's id
          # in the URL of its edit page, so a mismatch between the token
          # that was edited and the one the secret holds - which looks
          # identical to a permissions problem - can be settled by eye.
          echo "::group::Is the token valid and active, and which token is it?"
          api "user/tokens/verify" | jq -c "{success, id: .result.id, status: .result.status, errors: $err}"
          echo "::endgroup::"

          echo "::group::Can it see the eddy.global zone?"
          api "zones?name=eddy.global" | jq -c "{success, errors: $err, zones: [.result[]? | {id, name, status, account: .account.name}]}"
          echo "::endgroup::"

          account=$(api "accounts" | jq -r '.result[0].id // empty')
          echo "::group::Which Worker owns each custom domain?"
          api "accounts/$account/workers/domains" | jq -c "{success, errors: $err, domains: [.result[]? | {hostname, service, environment}]}"
          echo "::endgroup::"

      - name: Deploy API Worker (hkfc-api)
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Worker secrets kept in the production environment, set on every deploy
      # so rotating one is only a GitHub change. stdin only: a value never
      # reaches the command line or this (public) log. A secret not yet in
      # the environment is skipped, leaving the Worker's current one alone.
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATA_SUPABASE_SECRET_KEY: ${{ secrets.DATA_SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for name in DATA_SUPABASE_SECRET_KEY RESEND_API_KEY OPENROUTER_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name is not in the production environment yet; skipped."
              continue
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --config worker/wrangler.toml
          done

      # The render-pdf Edge Function (supabase/functions) on eddy-production,
      # which fills PDF templates for the Worker. It checks callers with the
      # project's own secret key, so it needs no secret of its own. Skipped
      # until SUPABASE_ACCESS_TOKEN (a Supabase personal access token: the
      # project keys cannot deploy functions) is in the production environment.
      - name: Deploy PDF function (eddy-production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not in the production environment; the PDF function was not deployed."
            exit 0
          fi
          npx --yes supabase@2.118.0 functions deploy render-pdf --project-ref biipqddulsbjpbmxuoss --use-api
