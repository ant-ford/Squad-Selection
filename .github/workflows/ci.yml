name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify

  # Deploys both Workers on a merge to main. Nothing deploys from a
  # developer machine: the Cloudflare token lives in the `production`
  # environment, whose deployment-branch policy admits main and nothing
  # else, so a pull request cannot reach it even by editing this file.
  #
  # `needs: verify` is what stops a red build reaching the club. The
  # pull_request trigger above already ran the same checks, but a merge
  # commit is not either parent, so it is verified on its own terms.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and never cancel one in flight: a half-applied
    # Worker upload is worse than a queued run.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # `npm run deploy` would build and deploy in one step, but the build
      # has to be its own step here so a bundling failure is reported as a
      # build failure rather than a deploy one.
      - name: Build web bundle
        run: npm run build

      # wrangler comes from the lockfile rather than an action that fetches
      # its own copy, so CI deploys with exactly the version developed
      # against. It reads CLOUDFLARE_API_TOKEN from the environment, which
      # is why no `wrangler login` is involved.
      #
      # CLOUDFLARE_ACCOUNT_ID is deliberately absent: wrangler resolves the
      # account itself when the token can see exactly one. Add it as an
      # environment secret only if a run fails asking to choose.
      - name: Deploy web Worker (hkfc-squad-selection)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # wrangler reports a failed trigger deploy as "a request to the
      # Cloudflare API ... failed" and drops the API's own error, which is
      # not enough to act on - it cannot distinguish a permission problem
      # from a conflicting DNS record. This asks the API the three
      # questions that tell those apart, and prints only parsed fields:
      # no request headers, so the token cannot reach a log that is public.
      - name: Explain a failed deploy
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() {
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"
          }
          err='[.errors[]? | {code, message}]'

          echo "::group::Is the token valid and active?"
          api "user/tokens/verify" | jq -c "{success, status: .result.status, errors: $err}"
          echo "::endgroup::"

          echo "::group::Can it see the eddy.global zone?"
          api "zones?name=eddy.global" | jq -c "{success, errors: $err, zones: [.result[]? | {id, name, status, account: .account.name}]}"
          echo "::endgroup::"

          account=$(api "accounts" | jq -r '.result[0].id // empty')
          echo "::group::Which Worker owns each custom domain?"
          api "accounts/$account/workers/domains" | jq -c "{success, errors: $err, domains: [.result[]? | {hostname, service, environment}]}"
          echo "::endgroup::"

      - name: Deploy API Worker (hkfc-api)
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
