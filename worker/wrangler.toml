name = "hkfc-api"
main = "src/index.ts"
compatibility_date = "2026-07-04"
# AsyncLocalStorage, for the per-request instrumentation and background
# cache invalidation in src/requestContext.ts. The narrowest Node flag that
# provides it - not nodejs_compat, which the API does not otherwise need.
compatibility_flags = ["nodejs_als"]

# Serve the API from the club's own domain instead of *.workers.dev.
# `custom_domain = true` makes `wrangler deploy` create the DNS record and
# certificate automatically; the eddy.global zone must be in the same
# Cloudflare account.
# workers_dev defaults to true, but it is stated explicitly so the
# *.workers.dev hostname is never dropped by accident while both are in use.
workers_dev = true

routes = [
  { pattern = "api.eddy.global", custom_domain = true }
]

[observability]
enabled = true

# Shared cache for the Stats summaries (see worker/src/cache.ts): they are
# expensive to build, so every isolate shares the one copy. Everything else
# is held in the isolate only.
#
# The Worker treats this binding as optional and falls back to the
# in-isolate cache without it, so commenting these lines out is a complete
# rollback: no migration, no state to unwind, the entries simply expire.
[[kv_namespaces]]
binding = "CACHE"
id = "841b5bd54444493ba85e09bffd2f9f49"

# Members' files (photos, documents), served only through signed links
# (src/files.ts).
[[r2_buckets]]
binding = "FILES"
bucket_name = "eddy-files"

[vars]
# Comma-separated allow-list. Both frontend hostnames are served during the
# domain move; the request's Origin is echoed back when it is on this list.
# Drop the workers.dev entry once that hostname is retired.
ALLOWED_ORIGIN = "https://app.eddy.global,https://hkfc-squad-selection.squad-selections.workers.dev"

SUPABASE_URL = "https://biipqddulsbjpbmxuoss.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_nwMTI17uq3Uk2u5tnm9g2w_0AZ_Vvod"
# eddy-production, which holds the club's data (the same project as
# sign-in, SUPABASE_URL above). Its secret key is the
# DATA_SUPABASE_SECRET_KEY secret, installed by the CI deploy.
DATA_SUPABASE_URL = "https://biipqddulsbjpbmxuoss.supabase.co"
# This Worker's public origin, for the links it hands out (signed file links).
API_ORIGIN = "https://api.eddy.global"
# Filled PDFs (src/pdf/), made by the render-pdf Edge Function that CI
# deploys to the data project. "off" stops making them.
PDFS = "on"
# The Club's membership office: each new member's signed application goes
# there as one PDF, from the Membership Officer (src/pdf/application.ts).
CLUB_MEMBERSHIP_EMAIL = "HKFC Membership Department <membership_dept@hkfc.com>"
CLUB_MEMBERSHIP_CONTACT = "Caren"
# An existing member's levy form goes to the front desk.
FRONT_DESK_EMAIL = "HKFC Front Desk <frontdesk@hkfc.com>"
# Email (src/mailer.ts). The Resend key is the RESEND_API_KEY secret,
# installed by the CI deploy.
MAIL_FROM = "Eddy <notifications@eddy.global>"
APP_ORIGIN = "https://app.eddy.global"
# The review request goes in the captain's name, copied to the membership inbox.
REVIEW_EMAIL_FROM = "Anthony Ford <menscaptain@hkfchockey.com>"
# The model the commitment review drafts come from (src/reviewDrafts.ts), through
# OpenRouter. The key is the OPENROUTER_API_KEY secret; without it nothing is drafted.
AI_DRAFT_MODEL = "qwen/qwen3.8-27b"

# The data retention job (src/retention.ts): "remove" removes the personal
# details of people inactive for 13 months; "report" only counts them (the
# list is the retention_due_v view). Switched to remove on 7 Oct 2026 (owner).
RETENTION_MODE = "remove"

# The app's owner (src/systemHealth.ts): People api_ids, comma-separated,
# not emails (this file is public). They open /system and get the System
# line in My Tasks. The alert email when the daily health check fails goes
# to SYSTEM_ALERT_EMAIL.
SYSTEM_OWNER_IDS = "recAfcgxZQ3GWcu3I"
SYSTEM_ALERT_EMAIL = "menscaptain@hkfchockey.com"

# The read-only switch for a restore (src/readOnly.ts, docs/RESTORE.md).
# "off": every save gets 503 READ_ONLY and the daily jobs are skipped;
# reads carry on. "on" otherwise.
WRITES = "on"

# The first sends the commitment review emails that are due
# (src/reviewEmails.ts); the second runs the data retention job
# (src/retention.ts RETENTION_CRON); the third the system health check
# (src/systemHealth.ts HEALTH_CRON).
# Last in the file on purpose: a TOML table header claims every key after it.
[triggers]
crons = ["0 3 * * *", "30 3 * * *", "0 4 * * *"]

# ── Branch preview (.github/workflows/preview.yml) ──────────────────────
# A separate Worker, hkfc-api-preview, deployed by hand from the Actions
# tab so a branch can be checked in a browser before it merges. It reads and
# writes eddy-preview (DATA_SUPABASE_URL below), so it cannot change club
# data even by mistake.
#
# Kept away from production on purpose:
#   - no custom domain (routes are inherited unless overridden);
#   - no cron (the daily jobs are production's);
#   - its OWN KV cache namespace (hkfc-api-preview-cache), so a branch never
#     writes entries production reads;
#   - CORS only for the local dev frontend (npm run dev:preview-api).
# vars and kv_namespaces are not inherited by an environment, so the ones it
# needs are restated here.
#
# The KV operation quota is per Cloudflare ACCOUNT, so this namespace shares
# it with production. Only the Stats summaries use KV, so a preview costs a
# handful of operations.
[env.preview]
routes = []

[[env.preview.kv_namespaces]]
binding = "CACHE"
id = "00df7f19eb074e5ab538ea2180b91932"

# Members' files (photos, documents), served only through signed links
# (src/files.ts). Preview's own copy, never production's.
[[env.preview.r2_buckets]]
binding = "FILES"
bucket_name = "eddy-files-preview"

[env.preview.vars]
# Local frontends only: the usual Vite port, and 5174 for a second one
# running at the same time (`vite --mode preview-api --port 5174`).
ALLOWED_ORIGIN = "http://localhost:5173,http://localhost:5174"
SUPABASE_URL = "https://biipqddulsbjpbmxuoss.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_nwMTI17uq3Uk2u5tnm9g2w_0AZ_Vvod"
# Preview reads and writes eddy-preview, which holds a copy of the club's
# data, so preview saves change that copy, never production's.
# Sign-in stays on eddy-production (SUPABASE_URL above); the data comes from
# eddy-preview. Its secret key is DATA_SUPABASE_SECRET_KEY, installed by
# .github/workflows/preview.yml.
DATA_SUPABASE_URL = "https://zlqzpzmqjqnrppmtevbv.supabase.co"
API_ORIGIN = "https://hkfc-api-preview.ant-ford.workers.dev"
PDFS = "on"
# Redirected to MAIL_REDIRECT_TO like all preview mail.
CLUB_MEMBERSHIP_EMAIL = "HKFC Membership Department <membership_dept@hkfc.com>"
CLUB_MEMBERSHIP_CONTACT = "Caren"
FRONT_DESK_EMAIL = "HKFC Front Desk <frontdesk@hkfc.com>"
# Preview never emails anyone real: everything goes to the captain, [PREVIEW].
MAIL_FROM = "Eddy <notifications@eddy.global>"
MAIL_REDIRECT_TO = "menscaptain@hkfchockey.com"
APP_ORIGIN = "http://localhost:5173"
REVIEW_EMAIL_FROM = "Anthony Ford <menscaptain@hkfchockey.com>"
# The model the commitment review drafts come from (src/reviewDrafts.ts), through
# OpenRouter. The key is the OPENROUTER_API_KEY secret; without it nothing is drafted.
AI_DRAFT_MODEL = "qwen/qwen3.8-27b"
# The owner's People row in eddy-preview has the same api_id.
SYSTEM_OWNER_IDS = "recAfcgxZQ3GWcu3I"
SYSTEM_ALERT_EMAIL = "menscaptain@hkfchockey.com"
# The read-only switch (src/readOnly.ts): "off" turns every save away.
WRITES = "on"

[env.preview.triggers]
crons = []
