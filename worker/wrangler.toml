name = "hkfc-api"
main = "src/index.ts"
compatibility_date = "2026-07-04"
# AsyncLocalStorage, for the per-request instrumentation and background
# cache invalidation in src/requestContext.ts. The narrowest Node flag that
# provides it - not nodejs_compat, which the API does not otherwise need.
compatibility_flags = ["nodejs_als"]

# Serve the API from the club's own domain instead of *.workers.dev.
# `custom_domain = true` makes `wrangler deploy` create the DNS record and
# certificate automatically; the eddy.global zone must be in the same
# Cloudflare account.
# workers_dev defaults to true, but it is stated explicitly so the
# *.workers.dev hostname is never dropped by accident while both are in use.
workers_dev = true

routes = [
  { pattern = "api.eddy.global", custom_domain = true }
]

[observability]
enabled = true

# Shared cache for raw Airtable reads (see worker/src/cache.ts).
#
# The in-isolate cache alone cannot help a request that lands on a cold
# isolate, which on this traffic is most of them - so most requests rebuilt
# everything from Airtable and took many seconds. KV gives those isolates
# something to share.
#
# The Worker treats this binding as optional and falls back to the
# in-isolate cache without it, so commenting these lines out is a complete
# rollback: no migration, no state to unwind, the entries simply expire.
[[kv_namespaces]]
binding = "CACHE"
id = "841b5bd54444493ba85e09bffd2f9f49"

[vars]
AIRTABLE_BASE_ID = "appG6amyHthm3Nnde"
# Comma-separated allow-list. Both frontend hostnames are served during the
# domain move; the request's Origin is echoed back when it is on this list.
# Drop the workers.dev entry once that hostname is retired.
ALLOWED_ORIGIN = "https://app.eddy.global,https://hkfc-squad-selection.squad-selections.workers.dev"

SUPABASE_URL = "https://rttbghxnacfrhjzzjwnh.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_HbNBcTHob3ZmXkYGWd8IlA_K_TI6UMk"
# The Airtable webhook from scripts/register-airtable-webhook.mjs. Its MAC
# secret is the AIRTABLE_WEBHOOK_SECRET Worker secret (set with
# `wrangler secret put`, never in this file). See README, "Airtable Webhook".
# Both must be present before the webhook does anything: the route stays 404
# and the cache TTLs stay short until then.
AIRTABLE_WEBHOOK_ID = "achSyLxyJ3s1MWk33"

# Refreshes the Airtable webhook (src/airtableWebhook.ts) once a day so it
# does not lapse over a quiet fortnight. Harmless when no webhook is set up.
# Last in the file on purpose: a TOML table header claims every key after it.
[triggers]
crons = ["0 3 * * *"]
